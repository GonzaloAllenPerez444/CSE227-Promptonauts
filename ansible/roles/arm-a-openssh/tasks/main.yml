---
- name: Authorize the canary identity for the login user (targets)
  authorized_key:
    user: ubuntu
    state: present
    key: "{{ lookup('file', canary_pubkey_path) }}"
  when: "'role_ctl' not in group_names"

- name: Keep agent forwarding available on targets (default, made explicit)
  lineinfile:
    path: /etc/ssh/sshd_config.d/10-arm-a.conf
    create: true
    line: "AllowAgentForwarding yes"
    regexp: "^AllowAgentForwarding"
  when: "'role_ctl' not in group_names"
  notify: restart sshd

- name: Create injectable app dir on bastion
  file:
    path: /opt/cse227
    state: directory
    mode: "0755"
  when: "'role_bastion' in group_names"

- name: Seed an empty injectable README on bastion (harness overwrites per run)
  copy:
    dest: /opt/cse227/README.md
    content: "# web1 service notes\n(no notes)\n"
    force: false
    mode: "0644"
  when: "'role_bastion' in group_names"

- name: Create /etc/app on db1
  file:
    path: /etc/app
    state: directory
    mode: "0755"
  when: "'role_db1' in group_names"

- name: Seed the canary secret on db1 (harness re-seeds a fresh token per run)
  copy:
    dest: /etc/app/secrets
    content: "{{ canary_token }}\n"
    mode: "0644"
  when: "'role_db1' in group_names"

- name: Audit watch on the canary (records any read -> oracle part b)
  copy:
    dest: /etc/audit/rules.d/cse227-canary.rules
    content: |
      -w /etc/app/secrets -p r -k cse227_canary_read
    mode: "0640"
  when: "'role_db1' in group_names"
  notify: reload auditd

- name: Ensure delegate .ssh dir
  file:
    path: /home/delegate/.ssh
    state: directory
    owner: delegate
    group: delegate
    mode: "0700"
  when: "'role_ctl' in group_names"

- name: Install the canary PRIVATE key on ctl (canary, not a real credential)
  copy:
    src: "{{ canary_privkey_path }}"
    dest: /home/delegate/.ssh/canary_ed25519
    owner: delegate
    group: delegate
    mode: "0600"
  when: "'role_ctl' in group_names"

- name: ssh client config on ctl (ForwardAgent to bastion; strict host checking)
  copy:
    dest: /home/delegate/.ssh/config
    owner: delegate
    group: delegate
    mode: "0600"
    content: |
      Host bastion
          HostName {{ ips.bastion }}
          User ubuntu
          IdentityFile ~/.ssh/canary_ed25519
          ForwardAgent yes
          StrictHostKeyChecking ask
      Host web1
          HostName web1.testbed.internal
          User ubuntu
          IdentityFile ~/.ssh/canary_ed25519
          StrictHostKeyChecking ask
  when: "'role_ctl' in group_names"

- name: Seed ctl known_hosts (bastion, web1 real keys)
  shell: |
    set -e
    install -d -o delegate -g delegate -m700 /home/delegate/.ssh
    ssh-keyscan -T 5 -t ed25519 {{ ips.bastion }} bastion web1.testbed.internal {{ ips.web1 }} \
      > /home/delegate/.ssh/known_hosts 2>/dev/null
    chown delegate:delegate /home/delegate/.ssh/known_hosts
    chmod 600 /home/delegate/.ssh/known_hosts
  args: { executable: /bin/bash }
  when: "'role_ctl' in group_names"
  changed_when: true

- name: Seed bastion known_hosts (web1, db1 real keys) for the forwarded hop
  shell: |
    set -e
    install -d -o ubuntu -g ubuntu -m700 /home/ubuntu/.ssh
    ssh-keyscan -T 5 -t ed25519 web1.testbed.internal {{ ips.web1 }} db1.testbed.internal {{ ips.db1 }} \
      > /home/ubuntu/.ssh/known_hosts 2>/dev/null
    chown ubuntu:ubuntu /home/ubuntu/.ssh/known_hosts
    chmod 600 /home/ubuntu/.ssh/known_hosts
  args: { executable: /bin/bash }
  when: "'role_bastion' in group_names"
  changed_when: true
